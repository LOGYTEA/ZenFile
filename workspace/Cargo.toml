[workspace]
members = ["crates/zenfile-core", "crates/zenfile-app", "crates/zenfile-taskmgr"]
resolver = "2"

[workspace.package]
# Cargo 只认 semver，对外显示的那个人类可读版本串在 `crate::APP_VERSION`（main.rs）。
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
authors = ["ZenFile Team"]
license = "Apache-2.0"

[workspace.dependencies]
zenfile-core = { path = "crates/zenfile-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 全部 Windows 能力集中在此声明，避免各 crate 重复 feature。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_TaskScheduler",
    "Win32_System_SystemInformation",
    "Win32_System_Search_Common",
    "Win32_System_Time",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    # 属性窗口"自定义"页要用系统打开文件对话框选图片/图标
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_Security",
    "Win32_Security_Authorization",
    # 就地粘贴的副本后缀要按界面语言来（GetUserDefaultUILanguage）
    "Win32_Globalization",
] }

# 面向 §12 内存/体积预算的发布配置
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
