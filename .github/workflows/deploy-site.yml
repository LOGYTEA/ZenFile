name: Deploy site

# 推送即自动构建发布到 https://logytea.github.io/ZenFile/
# 首次需要仓库设置里把 Settings → Pages → Source 选成 "GitHub Actions"
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  # 允许在 Actions 页手动触发
  workflow_dispatch:

# 发布进行中不允许新的一次打断：中断会让 Pages 拿到半套产物
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read      # checkout 需要
  pages: write        # 部署到 gh-pages
  id-token: write     # Pages 的 OIDC 认证，缺这个部署会 403

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # vite 7 要求 Node ^20.19.0 || >=22.12.0，锁 22
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
