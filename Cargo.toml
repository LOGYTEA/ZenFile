[workspace]
members = ["crates/zenfile-core", "crates/zenfile-app", "crates/zenfile-taskmgr"]
resolver = "2"

[workspace.package]
# Cargo 只认 semver，对外显示的那个人类可读版本串在 `crate::APP_VERSION`（main.rs）。
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
authors = ["ZenFile Team"]
license = "Apache-2.0"

[workspace.dependencies]
zenfile-core = { path = "crates/zenfile-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 第78轮 OLE 拖放：`#[windows_core::implement(IDropSource / IDropTarget)]` 这个
# 属性宏展开出来的代码里写的是 `windows_core::` 绝对路径，所以 `windows-core`
# 必须是一个**直接**依赖，光靠 `windows::core` 这个再导出不够。
# 版本与上面的 `windows` 保持一致（cargo 会把它们并成同一个实例）。
windows-core = "0.62"

# 全部 Windows 能力集中在此声明，避免各 crate 重复 feature。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    # 第78轮 OLE 拖放：`CF_HDROP` 的 `STGMEDIUM` 与 `ReleaseStgMedium` 都在这
    # 个子 feature 后面（windows-rs 把它们和 StructuredStorage 绑在一起）。
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_TaskScheduler",
    "Win32_System_SystemInformation",
    # 第78轮 OLE 拖放：`IDropSource` / `IDropTarget` 两个 COM 接口的回调签名里
    # 按键状态是 `MODIFIERKEYS_FLAGS`，它就在 SystemServices 里。
    "Win32_System_SystemServices",
    # 第69轮帧链路埋点：QueryPerformanceCounter / QueryPerformanceFrequency。
    # 必须单独开这个 feature —— QPC **不在** SystemInformation 里（那是
    # GetTickCount64 等），没有它整个 Performance 模块编译不出来。
    "Win32_System_Performance",
    # 基准工具要量"扫描期间的内存占用"：GetProcessMemoryInfo /
    # PROCESS_MEMORY_COUNTERS.PeakWorkingSetSize 在 ProcessStatus 里。
    # 缺这个 feature 的话整个模块编译不出来（不是符号找不到，是模块不存在）。
    "Win32_System_ProcessStatus",
    "Win32_System_Search_Common",
    "Win32_System_Time",
    # 侧栏"网络"节点：MPR 的 WNet* 系列（网络驱动器/共享枚举）。
    # Windows_Root 不用，但 NETRESOURCEW 等类型挂在 WNet 模块下。
    "Win32_NetworkManagement_WNet",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    # 属性窗口"自定义"页要用系统打开文件对话框选图片/图标
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_Security",
    "Win32_Security_Authorization",
    # 就地粘贴的副本后缀要按界面语言来（GetUserDefaultUILanguage）
    "Win32_Globalization",
] }

# 面向 §12 内存/体积预算的发布配置
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
